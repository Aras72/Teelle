<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fffaf0">
    <title>فعلاً آفلاینی | تیله</title>
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('teelle-theme')||''}catch(e){}</script>
    <style>
        :root{color-scheme:light;--bg:#fffaf0;--card:#fff8e6;--text:#123f46;--muted:#3b585c;--action:#c51632;--border:#d9ccaa}
        :root[data-theme=dark]{color-scheme:dark;--bg:#062a32;--card:#0d414a;--text:#fff0cf;--muted:#cfccb9;--action:#d51d37;--border:#31585e}
        *{box-sizing:border-box}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:1rem;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.9}
        main{width:min(100%,34rem);padding:clamp(1.5rem,6vw,3rem);text-align:center;border:1px solid var(--border);border-radius:1.25rem;background:var(--card)}
        img{width:8rem;height:8rem;object-fit:contain}h1{margin:.75rem 0 .25rem;font-size:clamp(1.75rem,7vw,2.5rem)}p{margin:0 auto 1.5rem;color:var(--muted)}button{min-height:44px;padding:.75rem 1.5rem;border:0;border-radius:999px;background:var(--action);color:#fff8e6;font:700 1rem Tahoma,Arial,sans-serif;cursor:pointer}
        button:focus-visible{outline:3px solid var(--text);outline-offset:3px}
    </style>
</head>
<body>
<main>
    <img src="/images/marbles/heartbeat-cobalt-v1.webp" width="768" height="768" alt="">
    <h1>فعلاً آفلاینی</h1>
    <p>به محض برگشتن اینترنت، تیله دوباره کنارت است</p>
    <button type="button" onclick="location.reload()">دوباره تلاش کن</button>
</main>
</body>
</html>
