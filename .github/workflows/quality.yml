name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Laravel and frontend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: teelle_test
      DB_USERNAME: teelle
      DB_PASSWORD: teelle_ci
      DB_SCHEMA_VALIDATION: "true"

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: teelle_test
          MYSQL_USER: teelle
          MYSQL_PASSWORD: teelle_ci
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, fileinfo, intl, mbstring, pdo_mysql
          coverage: none

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run JavaScript tests
        run: pnpm test

      - name: Build production assets
        run: pnpm build

      - name: Allow audited trigger creation in the disposable database
        run: >-
          php -r '$pdo = new PDO("mysql:host=127.0.0.1;port=3306", "root", "root_ci");
          $pdo->exec("SET GLOBAL log_bin_trust_function_creators = 1");'

      - name: Run Laravel regression on MySQL 8.4
        run: vendor/bin/phpunit

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Compile Blade views
        run: php artisan view:cache

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level=low

      - name: Prepare no-terminal deployment bundle
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Upload PHP 8.4 deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: teelle-web-php84-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/web
            !apps/web/.env
            !apps/web/node_modules
            !apps/web/tests
            !apps/web/storage/logs/*
            !apps/web/storage/framework/cache/data/*
            !apps/web/storage/framework/sessions/*
            !apps/web/storage/framework/views/*
